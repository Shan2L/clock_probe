[project]
name = "clock-probe"
version = "0.1.0"
description = "Cross-node software clock calibration for Ray GPU clusters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pylint>=4.0.7",
]

[project.optional-dependencies]
ray = ["ray"]
presentation = [
    "python-pptx>=1.0.2",
]

[project.scripts]
clock-probe-ray = "clock_probe.ray_agent:main"
clock-probe-align = "clock_probe.trace_align:main"
clock-probe-nccl-check = "clock_probe.nccl_check:main"
clock-probe-clc = "clock_probe.clc:main"
clock-probe-report = "clock_probe.report:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clock_probe*"]
