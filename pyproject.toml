[project]
name = "clock-probe"
version = "0.1.0"
description = "Cross-node software and PHC Trace clock calibration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ray = ["ray"]

[project.scripts]
clock-probe = "clock_probe.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clock_probe*"]

[tool.setuptools.data-files]
"share/clock-probe/ptp" = ["configs/ptp/*.conf"]
